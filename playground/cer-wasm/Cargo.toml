# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CEr as a WebAssembly module for the playground: `cargo build --release
# --target wasm32-wasip1`. A C ABI (src/lib.rs); the page gives it a small
# WASI shim for the clock, random numbers and stdout.

[package]
name = "cer-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cer = { path = "../../cer" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = false
debug = false
panic = "abort"

[workspace]
