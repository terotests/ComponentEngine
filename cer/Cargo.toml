#
# CEr: ComponentEngine's JavaScript evaluator as a strict Rust module (see
# src/lib.rs). The same source builds here with cargo and with `rgrc` for the
# other targets.

[package]
name = "cer"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
ranger = { git = "https://github.com/terotests/Ranger.git", rev = "ecedb1622b431aab5e6fef91c406cd04307da817" }

[profile.release]
overflow-checks = false
debug = false

