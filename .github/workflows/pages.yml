# Build the ComponentEngine playground and publish it on GitHub Pages
# (https://terotests.github.io/ComponentEngine/). Every push and pull request
# builds it and runs the browser smoke test; only main is deployed.

name: Playground

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 45 min, and Hermes's one-time build on top when its cache is cold
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - run: npm ci

      # Hermes as WebAssembly (playground/hermes/build.sh, ~30 min): built
      # once per version of the script and kept in the cache
      - id: hermes-key
        run: echo "key=hermes-wasm-${{ hashFiles('playground/hermes/build.sh', 'playground/hermes/host.cpp') }}" >> "$GITHUB_OUTPUT"
      - id: hermes-cache
        uses: actions/cache/restore@v4
        with:
          path: playground/hermes/dist
          key: ${{ steps.hermes-key.outputs.key }}
      - if: steps.hermes-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
      - name: Build Hermes as WebAssembly
        id: hermes-build
        if: steps.hermes-cache.outputs.cache-hit != 'true'
        # without it the page lists Hermes as not built
        continue-on-error: true
        run: |
          sudo apt-get install -y ninja-build
          HERMES_WORK="$RUNNER_TEMP/hermes" playground/hermes/build.sh
      - if: steps.hermes-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: playground/hermes/dist
          key: ${{ steps.hermes-key.outputs.key }}

      - name: Build the playground
        run: node playground/build.mjs --strict

      - name: Smoke test in Chromium
        run: |
          npx playwright-core install chromium
          node playground/smoke.mjs --shot=playground-smoke.png
          # every engine but cer-js: CEr as Ranger-made JS takes ~2 s a case,
          # about 50 min for the 1370 conformance cases, past the job's limit
          # (its own CI job checks it, and the benchmark above runs it)
          ENGINES=native,cer-wasm,cerxes-wasm,cerxes-stack,cerxes-small,cerxes-jit,quickjs,hermes node playground/smoke.mjs --zoo=conf --shot=playground-zoo.png
          node playground/smoke.mjs --evg --shot=playground-evg.png
          node playground/smoke.mjs --sandbox --shot=playground-sandbox.png

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('playground/hermes/dist/hermes.wasm') != ''
        with:
          name: hermes-wasm
          path: playground/hermes/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-smoke
          path: playground-*.png
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: playground/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
