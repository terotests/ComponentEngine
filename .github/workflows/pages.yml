# Build the ComponentEngine playground and publish it on GitHub Pages
# (https://terotests.github.io/ComponentEngine/). Every push and pull request
# builds it and runs the browser smoke test; only main is deployed.
#
# The compiler is Ranger master's dist/rgrc.js (a sparse checkout): CEr's
# rgrc build needs ranger-compiler 4.0.1, and npm has 4.0.0.
name: Playground

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  WASI_SDK_VERSION: "29"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the Ranger compiler
        uses: actions/checkout@v4
        with:
          repository: terotests/Ranger
          ref: master
          path: .ranger
          fetch-depth: 1
          sparse-checkout: |
            dist
            compiler
            lib
            bin

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install wasi-sdk
        run: |
          curl -sSL -o /tmp/wasi-sdk.tgz "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          sudo mkdir -p /opt/wasi-sdk
          sudo tar xzf /tmp/wasi-sdk.tgz -C /opt/wasi-sdk --strip-components=1

      - run: npm ci

      - name: Build the playground
        run: node playground/build.mjs --strict
        env:
          RANGER_ROOT: ${{ github.workspace }}/.ranger
          WASI_SDK_PATH: /opt/wasi-sdk

      - name: Smoke test in Chromium
        run: |
          npx playwright-core install chromium
          node playground/smoke.mjs --shot=playground-smoke.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-smoke
          path: playground-smoke.png
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: playground/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
