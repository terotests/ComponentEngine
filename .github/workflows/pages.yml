# Build the ComponentEngine playground and publish it on GitHub Pages
# (https://terotests.github.io/ComponentEngine/). Every push and pull request
# builds it and runs the browser smoke test; only main is deployed.

name: Playground

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - run: npm ci

      - name: Build the playground
        run: node playground/build.mjs --strict

      - name: Smoke test in Chromium
        run: |
          npx playwright-core install chromium
          node playground/smoke.mjs --shot=playground-smoke.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-smoke
          path: playground-smoke.png
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: playground/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
