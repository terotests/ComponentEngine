name: Fuzz

# CErXes fuzzing (cerxes/fuzz/README.md). Not part of "All tests": a finding
# does not block a pull request. Runs every night and by hand ("Run
# workflow": minutes, jobs, extra flags). Findings are the "fuzz-out"
# artifact; the job summary shows the counts per class and the known
# findings (cerxes/fuzz/known/known.txt) with their hits.
#
# Shards, all on the checked build (debug assertions on):
#   default  generated + mutated programs, every differential oracle, Node
#   heavy    resource limits (deep recursion, huge allocations)
#   hostile  forged snapshots and code-cache units (60 %), preemption (30 %)
#   jit      the wasm engine with the baseline JIT: native vs wasm, JIT off vs on

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per shard"
        default: "30"
      extra:
        description: "Extra flags for cerxes-fuzz run (e.g. --node, --heavy, --rc-check)"
        default: "--node"

permissions:
  contents: read

jobs:
  fuzz:
    name: cerxes-fuzz (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [default, heavy, hostile, jit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cerxes/fuzz/target
          key: fuzz-${{ matrix.mode }}-${{ hashFiles('cerxes/Cargo.lock', 'cerxes/fuzz/Cargo.toml') }}
      - name: Build
        run: cd cerxes/fuzz && cargo build --profile checked
      - name: Build the wasm engine with the JIT
        if: matrix.mode == 'jit'
        run: echo "WASM=$(cerxes/fuzz/jit/build.sh)" >> "$GITHUB_ENV"
      - name: Fuzz
        env:
          MINUTES: ${{ github.event.inputs.minutes || '30' }}
          EXTRA: ${{ github.event.inputs.extra || '--node' }}
        run: |
          flags="$EXTRA"
          case "${{ matrix.mode }}" in
            heavy) flags="--heavy" ;;
            hostile) flags="--hostile 60 --preempt 30" ;;
            jit) flags="--jit $WASM --jit-pct 60" ;;
          esac
          cerxes/fuzz/target/checked/cerxes-fuzz run \
            --time $((MINUTES * 60)) --jobs $(nproc) --seed ${{ github.run_id }} \
            --out fuzz-out --corpus cerxes/tests/cases.txt --corpus cer/tests/cases.txt \
            --corpus cerxes/tests/v8/own --corpus cerxes/fuzz/seeds $flags
      - name: Summary
        if: always()
        run: |
          echo '### cerxes-fuzz (${{ matrix.mode }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat fuzz-out/summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-out-${{ matrix.mode }}
          path: |
            fuzz-out
            !fuzz-out/.worker*
            !fuzz-out/.node*
          retention-days: 30
