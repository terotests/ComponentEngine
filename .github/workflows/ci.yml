name: CI

# Every pull request and every push to main runs the tests of all three
# parts. "All tests" passes only when every test job passed: it is the one
# check main's ruleset requires (.github/rulesets/protect-main.json), so a
# pull request cannot be merged into main while a test fails.

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

jobs:
  engine:
    name: engine (Ranger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build and smoke-test the Node module
        run: npm test

  cer:
    name: CEr (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path cer/Cargo.toml
      - name: Unit tests
        run: cargo test --release --manifest-path cer/Cargo.toml
      - name: Run a script
        run: |
          echo 'var a=[1,2,3];console.log(a.map(function(x){return x*x}).join("-"))' > /tmp/t.js
          test "$(cer/target/release/cer /tmp/t.js)" = "1-4-9"

  cerxes:
    name: CErXes (cargo, rgrc JS / C++ / Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: npm ci
      - name: Unit tests (cargo)
        run: cargo test --release --manifest-path cerxes/Cargo.toml
      - name: The same cases on the rgrc builds (JavaScript, C++, Go)
        run: node cerxes/bench/cases.mjs --targets=js,cpp,go --build

  all-tests:
    name: All tests
    if: always()
    needs: [engine, cer, cerxes]
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a test job did not pass: $r"
              exit 1
            fi
          done
